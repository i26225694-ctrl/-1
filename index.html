<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Центр загрузки</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Segoe UI, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 20px 80px 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 35px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .icon { font-size: 48px; margin-bottom: 15px; }
        h1 { font-size: 24px; margin: 0 0 10px 0; }
        .desc { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .meta {
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
            font-size: 16px;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            border: none;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn:hover { background-color: #2563eb; }
        .btn:disabled { background-color: #475569; cursor: not-allowed; }
        .btn-back { background-color: #475569; }
        .btn-back:hover { background-color: #64748b; }
        .progress-box { display: none; margin-top: 20px; text-align: left; }
        .bar-bg { width: 100%; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-top: 6px; }
        .bar-fill { height: 100%; width: 0%; background: #10b981; transition: width 0.2s; }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 0;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            text-align: center;
            z-index: 9999;
        }
        .author-btn {
            background: #1e293b;
            border: 1px solid #3b82f6;
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .author-btn:hover { background: #3b82f6; }

        .author-panel {
            display: none;
            position: fixed;
            bottom: 65px;
            background: #1e293b;
            border: 1px solid #3b82f6;
            border-radius: 16px;
            padding: 25px;
            max-width: 400px;
            width: 90%;
            text-align: left;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            z-index: 9998;
        }
        .author-panel input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">📁</div>
        <h1 id="title-text">GTA V — Сборка</h1>
        <p class="desc" id="desc-text">Нажмите кнопку ниже, чтобы подготовить и скачать актуальную версию.</p>
        
        <div class="meta">
            <span id="file-name">Папка не выбрана</span> • <span id="file-size">0 МБ</span>
        </div>

        <button class="btn" id="dl-btn" disabled>⬇ Скачать и установить</button>

        <div class="progress-box" id="prog-box">
            <div style="display:flex; justify-content:space-between; font-size:13px; color:#94a3b8;">
                <span id="prog-status">Подготовка...</span>
                <span id="prog-pct">0%</span>
            </div>
            <div class="bar-bg"><div class="bar-fill" id="prog-fill"></div></div>
        </div>
    </div>

    <div class="author-panel" id="panel">
        <div id="step1">
            <label>Пароль автора:</label>
            <input type="password" id="pass-input" placeholder="Введите пароль">
            <button class="btn" id="btn-login">Войти</button>
            <button class="btn btn-back" id="btn-close">Назад</button>
        </div>

        <div id="step2" style="display:none;">
            <label>Название на странице:</label>
            <input type="text" id="new-title" value="GTA V — Сборка">
            
            <label>Описание:</label>
            <input type="text" id="new-desc" value="Официальная сборка для быстрой установки.">
            
            <label>Выберите ПАПКУ с компьютера:</label>
            <input type="file" id="folder-input" webkitdirectory directory>
            
            <button class="btn" id="btn-save" style="background:#10b981;">Опубликовать папку</button>
            <button class="btn btn-back" id="btn-back2">Назад</button>
        </div>
    </div>

    <div class="bottom-bar">
        <button class="author-btn" id="btn-author">🔒 Вход для автора</button>
    </div>

    <script>
        var linkUrl = "";
        var saveName = "";

        var btnAuthor = document.getElementById("btn-author");
        var btnLogin = document.getElementById("btn-login");
        var btnClose = document.getElementById("btn-close");
        var btnBack2 = document.getElementById("btn-back2");
        var btnSave = document.getElementById("btn-save");
        var dlBtn = document.getElementById("dl-btn");
        var panel = document.getElementById("panel");

        btnAuthor.addEventListener("click", function() {
            if (panel.style.display === "block") {
                panel.style.display = "none";
            } else {
                panel.style.display = "block";
            }
        });

        btnClose.addEventListener("click", function() {
            panel.style.display = "none";
        });

        btnBack2.addEventListener("click", function() {
            document.getElementById("step2").style.display = "none";
            document.getElementById("step1").style.display = "block";
        });

        btnLogin.addEventListener("click", function() {
            var p = document.getElementById("pass-input").value;
            if (p === "1234") {
                document.getElementById("step1").style.display = "none";
                document.getElementById("step2").style.display = "block";
            } else {
                alert("Неверный пароль!");
            }
        });

        btnSave.addEventListener("click", async function() {
            var inp = document.getElementById("folder-input");
            var files = inp.files;
            if (!files || files.length === 0) {
                alert("Сначала выберите папку!");
                return;
            }

            btnSave.disabled = true;
            btnSave.innerText = "Упаковка папки...";

            try {
                var totalSize = 0;
                for (var i = 0; i < files.length; i++) {
                    totalSize += files.item(i).size;
                }

                var firstPath = files.item(0).webkitRelativePath || "folder";
                var folderName = firstPath.split("/").shift() || "folder";

                var enc = new TextEncoder();
                var chunks = new Array();
                var dirChunks = new Array();
                var pos = 0;

                for (var j = 0; j < files.length; j++) {
                    var f = files.item(j);
                    var nameBuf = enc.encode(f.webkitRelativePath || f.name);
                    var dataBuf = new Uint8Array(await f.arrayBuffer());
                    var len = dataBuf.length;

                    var head = new Uint8Array(30 + nameBuf.length);
                    var dv = new DataView(head.buffer);
                    dv.setUint32(0, 67324752, true);
                    dv.setUint16(4, 10, true);
                    dv.setUint16(6, 2056, true);
                    dv.setUint32(18, len, true);
                    dv.setUint32(22, len, true);
                    dv.setUint16(26, nameBuf.length, true);
                    head.set(nameBuf, 30);

                    var desc = new Uint8Array(16);
                    var ddv = new DataView(desc.buffer);
                    ddv.setUint32(0, 134695760, true);
                    ddv.setUint32(8, len, true);
                    ddv.setUint32(12, len, true);

                    chunks.push(head, dataBuf, desc);

                    var cdir = new Uint8Array(46 + nameBuf.length);
                    var cdv = new DataView(cdir.buffer);
                    cdv.setUint32(0, 33639248, true);
                    cdv.setUint16(4, 10, true);
                    cdv.setUint16(6, 10, true);
                    cdv.setUint16(8, 2056, true);
                    cdv.setUint32(20, len, true);
                    cdv.setUint32(24, len, true);
                    cdv.setUint16(28, nameBuf.length, true);
                    cdv.setUint32(42, pos, true);
                    cdir.set(nameBuf, 46);

                    dirChunks.push(cdir);
                    pos += head.length + len + 16;
                }

                var dirSize = 0;
                for (var k = 0; k < dirChunks.length; k++) {
                    var item = dirChunks.slice(k, k + 1).pop();
                    chunks.push(item);
                    dirSize += item.length;
                }

                var end = new Uint8Array(22);
                var edv = new DataView(end.buffer);
                edv.setUint32(0, 101010256, true);
                edv.setUint16(8, files.length, true);
                edv.setUint16(10, files.length, true);
                edv.setUint32(12, dirSize, true);
                edv.setUint32(16, pos, true);
                chunks.push(end);

                var blob = new Blob(chunks, { type: "application/zip" });
                linkUrl = URL.createObjectURL(blob);
                saveName = folderName + ".zip";

                document.getElementById("title-text").innerText = document.getElementById("new-title").value;
                document.getElementById("desc-text").innerText = document.getElementById("new-desc").value;
                document.getElementById("file-name").innerText = folderName + " (" + files.length + " файлов)";

                var sizeText = (totalSize > 1073741824) 
                    ? (totalSize / 1073741824).toFixed(2) + " ГБ" 
                    : (totalSize / 1048576).toFixed(2) + " МБ";
                document.getElementById("file-size").innerText = sizeText;

                dlBtn.disabled = false;
                panel.style.display = "none";
                alert("Папка успешно упакована и опубликована!");
            } catch (e) {
                alert("Папка слишком большая для памяти браузера. Уменьшите её размер до 500-800 МБ.");
            }

            btnSave.disabled = false;
            btnSave.innerText = "Опубликовать папку";
        });

        dlBtn.addEventListener("click", function() {
            if (!linkUrl) return;
            dlBtn.disabled = true;
            document.getElementById("prog-box").style.display = "block";
            
            var p = 0;
            var t = setInterval(function() {
                p = p + 25;
                if (p >= 100) {
                    p = 100;
                    clearInterval(t);
                    document.getElementById("prog-status").innerText = "Готово! Скачивание...";
                    var a = document.createElement("a");
                    a.href = linkUrl;
                    a.download = saveName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    dlBtn.disabled = false;
                }
                document.getElementById("prog-fill").style.width = p + "%";
                document.getElementById("prog-pct").innerText = p + "%";
            }, 300);
        });
    </script>

</body>
</html>
